name: "Create a Version Badge"

on:
  push:
    branches:
      - main  # Or your default branch, e.g., 'master'
    paths:
      - "VERSION.md"  # Triggers the workflow only when the VERSION file changes
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  version_badge:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from file
        id: version
        # Read the line immediately after the "## Current Version" header (robust against spacing)
        run: |
          VERSION_LINE=$(awk '/^## Current Version/{getline; print; exit}' VERSION.md)
          # strip CRLF if present and export
          echo "VERSION=$(echo "$VERSION_LINE" | tr -d '\r' | tr -d '\n')" >> $GITHUB_ENV
        
      - name: Create Version Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 8c14f658878fc5f1ecf8eee4d07f3cb4
          filename: version_GoSalesBot.json
          label: Version
          message: ${{ env.VERSION }}
          color: brightgreen