name: "Create a Version Badge"

on:
  push:
    branches:
      - main  # Or your default branch, e.g., 'master'
    paths:
      - "VERSION.md"  # Triggers the workflow only when the VERSION file changes
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  version_badge:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from file
        id: version
        # Extract a strict semver-looking line (e.g. 0.3.1) to avoid grabbing markdown or changelog text
        run: |
          set -euo pipefail
          VERSION=$(grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION.md | head -n1 | tr -d '\r' | tr -d '\n')
          if [ -z "${VERSION}" ]; then
            echo "Failed to extract version from VERSION.md" >&2
            exit 1
          fi
          # export as step output for reliable access in subsequent steps
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        
      - name: Create Version Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 8c14f658878fc5f1ecf8eee4d07f3cb4
          filename: version_GoSalesBot.json
          label: Version
          message: ${{ steps.version.outputs.version }}
          color: brightgreen